# AR Menu - armenu.shumtuber.uz
# Симлинк на сервере:
#   ln -sf /var/www/ar-menu/deploy/nginx-armenu.conf /etc/nginx/sites-available/ar-menu
#   ln -sf /etc/nginx/sites-available/ar-menu /etc/nginx/sites-enabled/ar-menu

server {
    server_name armenu.shumtuber.uz;

    root /var/www/ar-menu;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # --- Сервер заказов (server/index.js, systemd menulive-orders) ---
    # Контракт: docs/api-orders.md. Сервер слушает только 127.0.0.1:4010.

    # Поток событий SSE. Точное совпадение, приоритет выше любых регулярок.
    # Буферизацию и кэш обязательно выключаем, иначе события копятся в nginx
    # и долетают до официанта пачкой через минуту.
    location = /api/v1/stream {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        gzip off;
    }

    # Остальные методы API. Префикс с ^~, чтобы регулярки ниже
    # (.json, .js и прочие) не перехватывали пути API.
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4010;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cache-Control сервер ставит сам, дублировать не надо.
        proxy_read_timeout 60s;
        proxy_connect_timeout 5s;
    }

    # AR-таргеты MindAR
    location ~ \.mind$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # видео и 3D-модели: долгий кэш, Range-запросы nginx отдаёт сам
    location ~* \.(mp4|mov|glb)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Конфиги ресторанов всегда свежие
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    # Файлы движка: версия передаётся строкой ?v=N в HTML
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML всегда свежий, чтобы правки прилетали сразу после git pull
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    client_max_body_size 20M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/armenu.shumtuber.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armenu.shumtuber.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = armenu.shumtuber.uz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name armenu.shumtuber.uz;
    return 404;
}
