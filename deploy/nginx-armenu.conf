# AR Menu - armenu.shumtuber.uz
# Симлинк на сервере:
#   ln -sf /var/www/ar-menu/deploy/nginx-armenu.conf /etc/nginx/sites-available/ar-menu
#   ln -sf /etc/nginx/sites-available/ar-menu /etc/nginx/sites-enabled/ar-menu

server {
    server_name armenu.shumtuber.uz;

    root /var/www/ar-menu;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # AR-таргеты MindAR
    location ~ \.mind$ {
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=86400";
    }

    # видео и 3D-модели: долгий кэш, Range-запросы nginx отдаёт сам
    location ~* \.(mp4|mov|glb)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    # Конфиги ресторанов всегда свежие
    location ~* \.json$ {
        add_header Cache-Control "no-cache";
    }

    # Файлы движка: версия передаётся строкой ?v=N в HTML
    location ~* \.(js|css)$ {
        add_header Cache-Control "public, max-age=3600";
    }

    # HTML всегда свежий, чтобы правки прилетали сразу после git pull
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    client_max_body_size 20M;

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/armenu.shumtuber.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/armenu.shumtuber.uz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = armenu.shumtuber.uz) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    server_name armenu.shumtuber.uz;
    return 404;
}
