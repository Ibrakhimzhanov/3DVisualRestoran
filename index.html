<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Стабилизатор — сглаживает позицию и поворот + мёртвая зона
    AFRAME.registerComponent('smooth-track', {
      schema: {
        factor: {type: 'number', default: 0.04},
        posThreshold: {type: 'number', default: 0.002},
        rotThreshold: {type: 'number', default: 0.003}
      },
      init: function () {
        this.smoothPos = new THREE.Vector3();
        this.smoothQuat = new THREE.Quaternion();
        this.prevRawPos = new THREE.Vector3();
        this.prevRawQuat = new THREE.Quaternion();
        this.started = false;
      },
      tick: function () {
        const obj = this.el.object3D;
        if (!obj.visible) { this.started = false; return; }

        if (!this.started) {
          this.smoothPos.copy(obj.position);
          this.smoothQuat.copy(obj.quaternion);
          this.prevRawPos.copy(obj.position);
          this.prevRawQuat.copy(obj.quaternion);
          this.started = true;
          return;
        }

        // Dead zone: ignore micro-movements
        const posDelta = obj.position.distanceTo(this.prevRawPos);
        const rotDelta = this.prevRawQuat.angleTo(obj.quaternion);

        this.prevRawPos.copy(obj.position);
        this.prevRawQuat.copy(obj.quaternion);

        const f = this.data.factor;

        if (posDelta > this.data.posThreshold) {
          this.smoothPos.lerp(obj.position, f);
        }
        if (rotDelta > this.data.rotThreshold) {
          this.smoothQuat.slerp(obj.quaternion, f);
        }

        obj.position.copy(this.smoothPos);
        obj.quaternion.copy(this.smoothQuat);
      }
    });

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-src');
        const target = this.el.closest('[mindar-image-target]');
        this.el.setAttribute('visible', false);

        if (target) {
          target.addEventListener('targetFound', () => {
            this.el.setAttribute('visible', true);
            video.play().catch(() => {});
          });

          target.addEventListener('targetLost', () => {
            this.el.setAttribute('visible', false);
            video.pause();
          });
        }
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: -apple-system, sans-serif;
    }
    #loading h2 { font-size: 20px; margin-bottom: 10px; }
    #loading p { font-size: 14px; color: #aaa; text-align: center; padding: 0 30px; }
    .spinner {
      width: 40px; height: 40px; margin-bottom: 20px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #logo {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      z-index: 100;
    }
    #logo img {
      width: 70px; height: 70px;
      border-radius: 50%;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }

    #dish-name {
      position: fixed; top: 15px; left: 50%; transform: translateX(-50%);
      background: linear-gradient(180deg, rgba(245,238,228,0.95) 0%, rgba(235,225,210,0.95) 100%);
      padding: 14px 32px 12px;
      border-radius: 16px;
      border: 1px solid rgba(160,100,60,0.3);
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
      z-index: 100; display: none;
      text-align: center;
      min-width: 200px;
    }
    #dish-name .title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 28px; font-weight: 700;
      color: #5a2d0c;
      line-height: 1.1;
      text-shadow: 0 1px 2px rgba(0,0,0,0.1);
    }
    #dish-name .ornament {
      color: #8b5e3c;
      font-size: 16px;
      margin: 4px 0;
      opacity: 0.7;
    }
    #dish-name .price {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 20px; font-weight: 700;
      color: #7a3b10;
      letter-spacing: 1px;
    }

    #sound-btn {
      position: fixed; bottom: 100px; right: 20px;
      width: 50px; height: 50px;
      background: rgba(0,0,0,0.7); color: white;
      border: none; border-radius: 50%;
      font-size: 22px; z-index: 100;
      display: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    #ios-start {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 10000;
      display: none; justify-content: center; align-items: center;
      flex-direction: column; color: white;
      font-family: -apple-system, sans-serif;
    }
    #ios-start button {
      padding: 16px 40px; font-size: 18px;
      background: #b43214; color: white; border: none;
      border-radius: 12px; cursor: pointer;
    }
    #ios-start p { margin-bottom: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>AR Меню загружается...</h2>
    <p>Разрешите доступ к камере</p>
  </div>

  <div id="ios-start">
    <p>Нажмите чтобы запустить AR</p>
    <button id="ios-start-btn">Запустить</button>
  </div>

  <div id="logo"><img src="./logo.png" alt="AFRA Istanbul"></div>
  <div id="dish-name">
    <div class="title">Эт Кебаб</div>
    <div class="ornament">&#10087;</div>
    <div class="price">50.000 сум</div>
  </div>
  <button id="sound-btn">🔇</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.00001; filterBeta: 0.001; warmupTolerance: 2; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets>
      <video id="video-src" src="./el-kebab.mov" muted autoplay playsinline webkit-playsinline loop preload="auto"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" smooth-track="factor: 0.02; posThreshold: 0.005; rotThreshold: 0.008">
      <a-plane
        id="video-plane"
        material="shader: flat; src: #video-src;"
        width="1.6"
        height="0.9"
        position="0 0.5 0"
        video-handler>
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector('#video-src');
    const soundBtn = document.getElementById('sound-btn');
    const scene = document.querySelector('a-scene');
    const logo = document.getElementById('logo');
    const dishName = document.getElementById('dish-name');
    const iosOverlay = document.getElementById('ios-start');
    const iosBtn = document.getElementById('ios-start-btn');

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);

    scene.addEventListener('arReady', () => {
      document.getElementById('loading').style.display = 'none';

      if (isIOS) {
        // iOS: показываем кнопку запуска (нужен жест пользователя)
        iosOverlay.style.display = 'flex';
        iosBtn.addEventListener('click', () => {
          video.muted = true;
          video.play().then(() => {
            iosOverlay.style.display = 'none';
          }).catch(() => {
            iosOverlay.style.display = 'none';
          });
        });
      } else {
        video.play().catch(() => {});
      }
    });

    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      soundBtn.textContent = video.muted ? '🔇' : '🔊';
    });

    document.querySelectorAll('[mindar-image-target]').forEach((target) => {
      target.addEventListener('targetFound', () => {
        dishName.style.display = 'block';
        logo.style.display = 'block';
        soundBtn.style.display = 'block';
        video.play().catch(() => {});
      });

      target.addEventListener('targetLost', () => {
        dishName.style.display = 'none';
        logo.style.display = 'block';
        soundBtn.style.display = 'none';
      });
    });
  </script>

</body>
</html>
