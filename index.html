<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Стабилизатор — сглаживает позицию и поворот + мёртвая зона
    AFRAME.registerComponent('smooth-track', {
      schema: {
        factor: {type: 'number', default: 0.04},
        posThreshold: {type: 'number', default: 0.002},
        rotThreshold: {type: 'number', default: 0.003}
      },
      init: function () {
        this.smoothPos = new THREE.Vector3();
        this.smoothQuat = new THREE.Quaternion();
        this.prevRawPos = new THREE.Vector3();
        this.prevRawQuat = new THREE.Quaternion();
        this.started = false;
      },
      tick: function () {
        const obj = this.el.object3D;
        if (!obj.visible) { this.started = false; return; }

        if (!this.started) {
          this.smoothPos.copy(obj.position);
          this.smoothQuat.copy(obj.quaternion);
          this.prevRawPos.copy(obj.position);
          this.prevRawQuat.copy(obj.quaternion);
          this.started = true;
          return;
        }

        // Dead zone: ignore micro-movements
        const posDelta = obj.position.distanceTo(this.prevRawPos);
        const rotDelta = this.prevRawQuat.angleTo(obj.quaternion);

        this.prevRawPos.copy(obj.position);
        this.prevRawQuat.copy(obj.quaternion);

        const f = this.data.factor;

        if (posDelta > this.data.posThreshold) {
          this.smoothPos.lerp(obj.position, f);
        }
        if (rotDelta > this.data.rotThreshold) {
          this.smoothQuat.slerp(obj.quaternion, f);
        }

        obj.position.copy(this.smoothPos);
        obj.quaternion.copy(this.smoothQuat);
      }
    });

    // Pinch-to-zoom — масштабирование видео двумя пальцами
    AFRAME.registerComponent('pinch-zoom', {
      schema: {
        min: {type: 'number', default: 0.5},
        max: {type: 'number', default: 3.0}
      },
      init: function () {
        this.initialDist = 0;
        this.initialScale = 1;
        this.currentScale = 1;
        this.baseWidth = parseFloat(this.el.getAttribute('width'));
        this.baseHeight = parseFloat(this.el.getAttribute('height'));

        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            this.initialDist = this._dist(e.touches[0], e.touches[1]);
            this.initialScale = this.currentScale;
          }
        });

        canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            const dist = this._dist(e.touches[0], e.touches[1]);
            const ratio = dist / this.initialDist;
            this.currentScale = Math.min(this.data.max,
              Math.max(this.data.min, this.initialScale * ratio));
            this.el.setAttribute('width', this.baseWidth * this.currentScale);
            this.el.setAttribute('height', this.baseHeight * this.currentScale);
          }
        });
      },
      _dist: function (a, b) {
        const dx = a.clientX - b.clientX;
        const dy = a.clientY - b.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-src');
        const target = this.el.closest('[mindar-image-target]');
        this.el.setAttribute('visible', false);

        if (target) {
          target.addEventListener('targetFound', () => {
            this.el.setAttribute('visible', true);
            video.play().catch(() => {});
          });

          target.addEventListener('targetLost', () => {
            this.el.setAttribute('visible', false);
            video.pause();
          });
        }
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; }

    /* Принудительно скрыть VR кнопку A-Frame */
    .a-enter-vr, .a-enter-ar,
    [aframe-injected] { display: none !important; }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: -apple-system, sans-serif;
    }
    #loading h2 { font-size: 20px; margin-bottom: 10px; }
    #loading p { font-size: 14px; color: #aaa; text-align: center; padding: 0 30px; }
    .spinner {
      width: 40px; height: 40px; margin-bottom: 20px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Нижняя панель — логотип по центру, звук справа */
    #bottom-bar {
      position: fixed; bottom: 20px; left: 0; right: 0;
      z-index: 100; display: none;
      padding: 0 20px;
    }
    #logo {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
    }
    #logo img {
      width: 62px; height: 62px;
      border-radius: 50%;
      box-shadow: 0 2px 14px rgba(0,0,0,0.5);
    }

    /* Кнопка звука — пульсирующая, стиль MUU */
    #sound-btn {
      position: absolute; right: 16px; bottom: 6px;
      width: 50px; height: 50px;
      background: rgba(0,0,0,0.85);
      border: 2px solid #c8963e;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(200,150,62,0.4);
      -webkit-tap-highlight-color: transparent;
      display: flex; align-items: center; justify-content: center;
      animation: pulse-ring 2s ease-in-out infinite;
    }
    #sound-btn svg {
      width: 22px; height: 22px;
      fill: #c8963e;
    }
    #sound-btn.active {
      animation: none;
      border-color: #e8b84e;
      box-shadow: 0 0 8px rgba(232,184,78,0.3);
    }
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 6px rgba(200,150,62,0.3), 0 0 0 0 rgba(200,150,62,0.4); }
      50% { box-shadow: 0 0 12px rgba(200,150,62,0.5), 0 0 0 10px rgba(200,150,62,0); }
      100% { box-shadow: 0 0 6px rgba(200,150,62,0.3), 0 0 0 0 rgba(200,150,62,0); }
    }

    #ios-start {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 10000;
      display: none; justify-content: center; align-items: center;
      flex-direction: column; color: white;
      font-family: -apple-system, sans-serif;
    }
    #ios-start button {
      padding: 16px 40px; font-size: 18px;
      background: #b43214; color: white; border: none;
      border-radius: 12px; cursor: pointer;
    }
    #ios-start p { margin-bottom: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>AR Меню загружается...</h2>
    <p>Разрешите доступ к камере</p>
  </div>

  <div id="ios-start">
    <p>Нажмите чтобы запустить AR</p>
    <button id="ios-start-btn">Запустить</button>
  </div>

  <div id="bottom-bar">
    <div id="logo"><img src="./logomu.png" alt="MUU Steak House"></div>
    <button id="sound-btn">
      <svg id="sound-icon-off" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
        <line x1="23" y1="9" x2="17" y2="15" stroke="#c8963e" stroke-width="2" stroke-linecap="round"/>
        <line x1="17" y1="9" x2="23" y2="15" stroke="#c8963e" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <svg id="sound-icon-on" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="display:none">
        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
        <path d="M15.54 8.46a5 5 0 010 7.07" fill="none" stroke="#c8963e" stroke-width="2" stroke-linecap="round"/>
        <path d="M19.07 4.93a10 10 0 010 14.14" fill="none" stroke="#c8963e" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.00001; filterBeta: 0.001; warmupTolerance: 2; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets>
      <video id="video-src" muted autoplay playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"
        src="./dish-video.mp4">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" smooth-track="factor: 0.02; posThreshold: 0.005; rotThreshold: 0.008">
      <!-- Видео блюда — обычное видео -->
      <a-plane
        id="video-plane"
        material="shader: flat; src: #video-src; side: double"
        width="2.2"
        height="1.24"
        position="0 0.68 0.01"
        video-handler
        pinch-zoom="min: 0.5; max: 3">
      </a-plane>

      <!-- Видео шеф-повара — внизу, такой же размер -->
      <a-plane
        id="chef-plane"
        material="shader: flat; color: black; side: double"
        width="2.2"
        height="1.24"
        position="0 -0.68 0.005">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector('#video-src');
    const soundBtn = document.getElementById('sound-btn');
    const scene = document.querySelector('a-scene');
    const bottomBar = document.getElementById('bottom-bar');
    const iosOverlay = document.getElementById('ios-start');
    const iosBtn = document.getElementById('ios-start-btn');
    const chefPlane = document.getElementById('chef-plane');

    // Создаём chef видео динамически (не через a-assets чтобы не блокировать загрузку)
    const chefVideo = document.createElement('video');
    chefVideo.src = './chef.mp4';
    chefVideo.muted = true;
    chefVideo.loop = true;
    chefVideo.playsInline = true;
    chefVideo.setAttribute('webkit-playsinline', '');
    chefVideo.crossOrigin = 'anonymous';
    chefVideo.preload = 'auto';
    chefVideo.load();

    // Привязка chef видео к плоскости
    function applyChefTexture() {
      const mesh = chefPlane.getObject3D('mesh');
      if (mesh && !mesh._chefApplied) {
        const texture = new THREE.VideoTexture(chefVideo);
        texture.minFilter = THREE.LinearFilter;
        mesh.material = new THREE.MeshBasicMaterial({ map: texture });
        mesh._chefApplied = true;
      }
    }
    chefVideo.addEventListener('loadeddata', applyChefTexture);
    chefVideo.addEventListener('playing', applyChefTexture);

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    scene.addEventListener('arReady', () => {
      document.getElementById('loading').style.display = 'none';

      if (isIOS) {
        iosOverlay.style.display = 'flex';
        iosBtn.addEventListener('click', () => {
          video.muted = true;
          video.play().then(() => {
            chefVideo.play().catch(() => {});
            iosOverlay.style.display = 'none';
          }).catch(() => {
            iosOverlay.style.display = 'none';
          });
        });
      } else {
        video.play().catch(() => {});
        chefVideo.play().catch(() => {});
      }
    });

    const iconOff = document.getElementById('sound-icon-off');
    const iconOn = document.getElementById('sound-icon-on');
    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      if (video.muted) {
        iconOff.style.display = '';
        iconOn.style.display = 'none';
        soundBtn.classList.remove('active');
      } else {
        iconOff.style.display = 'none';
        iconOn.style.display = '';
        soundBtn.classList.add('active');
      }
    });

    document.querySelectorAll('[mindar-image-target]').forEach((target) => {
      target.addEventListener('targetFound', () => {
        bottomBar.style.display = 'block';
        chefPlane.setAttribute('visible', true);
        video.play().catch(() => {});
        chefVideo.play().catch(() => {});
      });

      target.addEventListener('targetLost', () => {
        bottomBar.style.display = 'none';
        chefPlane.setAttribute('visible', false);
      });
    });
  </script>

</body>
</html>
