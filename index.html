<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Стабилизатор — сглаживает позицию и поворот + мёртвая зона
    AFRAME.registerComponent('smooth-track', {
      schema: {
        factor: {type: 'number', default: 0.04},
        posThreshold: {type: 'number', default: 0.002},
        rotThreshold: {type: 'number', default: 0.003}
      },
      init: function () {
        this.smoothPos = new THREE.Vector3();
        this.smoothQuat = new THREE.Quaternion();
        this.prevRawPos = new THREE.Vector3();
        this.prevRawQuat = new THREE.Quaternion();
        this.started = false;
      },
      tick: function () {
        const obj = this.el.object3D;
        if (!obj.visible) { this.started = false; return; }

        if (!this.started) {
          this.smoothPos.copy(obj.position);
          this.smoothQuat.copy(obj.quaternion);
          this.prevRawPos.copy(obj.position);
          this.prevRawQuat.copy(obj.quaternion);
          this.started = true;
          return;
        }

        // Dead zone: ignore micro-movements
        const posDelta = obj.position.distanceTo(this.prevRawPos);
        const rotDelta = this.prevRawQuat.angleTo(obj.quaternion);

        this.prevRawPos.copy(obj.position);
        this.prevRawQuat.copy(obj.quaternion);

        const f = this.data.factor;

        if (posDelta > this.data.posThreshold) {
          this.smoothPos.lerp(obj.position, f);
        }
        if (rotDelta > this.data.rotThreshold) {
          this.smoothQuat.slerp(obj.quaternion, f);
        }

        obj.position.copy(this.smoothPos);
        obj.quaternion.copy(this.smoothQuat);
      }
    });

    // Pinch-to-zoom — масштабирование видео двумя пальцами
    AFRAME.registerComponent('pinch-zoom', {
      schema: {
        min: {type: 'number', default: 0.5},
        max: {type: 'number', default: 3.0}
      },
      init: function () {
        this.initialDist = 0;
        this.initialScale = 1;
        this.currentScale = 1;
        this.baseWidth = parseFloat(this.el.getAttribute('width'));
        this.baseHeight = parseFloat(this.el.getAttribute('height'));

        const canvas = document.querySelector('canvas');
        if (!canvas) return;

        canvas.addEventListener('touchstart', (e) => {
          if (e.touches.length === 2) {
            this.initialDist = this._dist(e.touches[0], e.touches[1]);
            this.initialScale = this.currentScale;
          }
        });

        canvas.addEventListener('touchmove', (e) => {
          if (e.touches.length === 2) {
            const dist = this._dist(e.touches[0], e.touches[1]);
            const ratio = dist / this.initialDist;
            this.currentScale = Math.min(this.data.max,
              Math.max(this.data.min, this.initialScale * ratio));
            this.el.setAttribute('width', this.baseWidth * this.currentScale);
            this.el.setAttribute('height', this.baseHeight * this.currentScale);
          }
        });
      },
      _dist: function (a, b) {
        const dx = a.clientX - b.clientX;
        const dy = a.clientY - b.clientY;
        return Math.sqrt(dx * dx + dy * dy);
      }
    });

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-top');
        const target = this.el.closest('[mindar-image-target]');
        this.el.setAttribute('visible', false);

        if (target) {
          target.addEventListener('targetFound', () => {
            this.el.setAttribute('visible', true);
            video.play().catch(() => {});
          });

          target.addEventListener('targetLost', () => {
            this.el.setAttribute('visible', false);
            video.pause();
          });
        }
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; }

    /* Принудительно скрыть VR кнопку A-Frame */
    .a-enter-vr, .a-enter-ar,
    [aframe-injected] { display: none !important; }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: -apple-system, sans-serif;
    }
    #loading h2 { font-size: 20px; margin-bottom: 10px; }
    #loading p { font-size: 14px; color: #aaa; text-align: center; padding: 0 30px; }
    .spinner {
      width: 40px; height: 40px; margin-bottom: 20px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Нижняя панель — логотип по центру, звук справа */
    #bottom-bar {
      position: fixed; bottom: 20px; left: 0; right: 0;
      z-index: 100; display: none;
      padding: 0 20px;
    }
    #dish-label {
      position: absolute; left: 50%; transform: translateX(-50%);
      bottom: 76px;
      background: rgba(0,0,0,0.82);
      border: 1px solid rgba(200,150,62,0.4);
      border-radius: 24px;
      padding: 7px 22px;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
    }
    .dish-name {
      font-family: -apple-system, sans-serif;
      font-size: 16px; font-weight: 700;
      color: #c8963e;
      letter-spacing: 0.5px;
    }
    .dish-sep {
      color: rgba(200,150,62,0.4);
      margin: 0 8px;
      font-size: 14px;
    }
    .dish-price {
      font-family: -apple-system, sans-serif;
      font-size: 15px; font-weight: 600;
      color: #e8c76a;
    }

    #logo {
      position: absolute; left: 50%; transform: translateX(-50%); bottom: 0;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      animation: logo-pulse 1.8s ease-in-out infinite;
    }
    #logo img {
      width: 66px; height: 66px;
      border-radius: 50%;
      box-shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
    #logo.sound-on {
      animation: none;
    }
    #logo.sound-on img {
      box-shadow: 0 0 8px rgba(200,150,62,0.3);
    }
    @keyframes logo-pulse {
      0% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 4px rgba(200,150,62,0.3)); }
      50% { transform: translateX(-50%) scale(1.1); filter: drop-shadow(0 0 14px rgba(200,150,62,0.7)); }
      100% { transform: translateX(-50%) scale(1); filter: drop-shadow(0 0 4px rgba(200,150,62,0.3)); }
    }

    #ios-start {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.8); z-index: 10000;
      display: none; justify-content: center; align-items: center;
      flex-direction: column; color: white;
      font-family: -apple-system, sans-serif;
    }
    #ios-start button {
      padding: 16px 40px; font-size: 18px;
      background: #b43214; color: white; border: none;
      border-radius: 12px; cursor: pointer;
    }
    #ios-start p { margin-bottom: 20px; font-size: 16px; }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>AR Меню загружается...</h2>
    <p>Разрешите доступ к камере</p>
  </div>

  <div id="ios-start">
    <p>Нажмите чтобы запустить AR</p>
    <button id="ios-start-btn">Запустить</button>
  </div>

  <div id="bottom-bar">
    <div id="dish-label">
      <span class="dish-name">Стейк</span>
      <span class="dish-sep">·</span>
      <span class="dish-price">180 000 сум</span>
    </div>
    <div id="logo"><img src="./logomu.png" alt="MUU Steak House"></div>
  </div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.0001; filterBeta: 0.5; warmupTolerance: 0; missTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets>
      <video id="video-top" muted autoplay playsinline webkit-playsinline loop preload="auto" crossorigin="anonymous"
        src="./mu2.mp4">
      </video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0" smooth-track="factor: 0.02; posThreshold: 0.005; rotThreshold: 0.008">
      <!-- Видео 1 (верх) — mu2.mp4, без звука -->
      <a-plane
        id="video-top-plane"
        material="shader: flat; src: #video-top; side: double"
        width="2.2"
        height="1.24"
        position="0 0.68 0.01"
        video-handler
        pinch-zoom="min: 0.5; max: 3">
      </a-plane>

      <!-- Видео 2 (низ) — dish-video.mp4, со звуком -->
      <a-plane
        id="video-bottom-plane"
        material="shader: flat; color: black; side: double"
        width="2.2"
        height="1.24"
        position="0 -0.68 0.005">
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const videoTop = document.querySelector('#video-top');
    const logo = document.getElementById('logo');
    const scene = document.querySelector('a-scene');
    const bottomBar = document.getElementById('bottom-bar');
    const iosOverlay = document.getElementById('ios-start');
    const iosBtn = document.getElementById('ios-start-btn');
    const bottomPlane = document.getElementById('video-bottom-plane');

    // Видео 2 (нижнее, со звуком) — загружаем динамически
    const videoBottom = document.createElement('video');
    videoBottom.src = './dish-video.mp4';
    videoBottom.muted = true;
    videoBottom.loop = true;
    videoBottom.playsInline = true;
    videoBottom.setAttribute('webkit-playsinline', '');
    videoBottom.crossOrigin = 'anonymous';
    videoBottom.preload = 'auto';
    videoBottom.load();

    // Привязка нижнего видео к плоскости
    function applyBottomTexture() {
      const mesh = bottomPlane.getObject3D('mesh');
      if (mesh && !mesh._applied) {
        const texture = new THREE.VideoTexture(videoBottom);
        texture.minFilter = THREE.LinearFilter;
        mesh.material = new THREE.MeshBasicMaterial({ map: texture });
        mesh._applied = true;
      }
    }
    videoBottom.addEventListener('loadeddata', applyBottomTexture);
    videoBottom.addEventListener('playing', applyBottomTexture);

    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
    scene.addEventListener('arReady', () => {
      document.getElementById('loading').style.display = 'none';

      if (isIOS) {
        iosOverlay.style.display = 'flex';
        iosBtn.addEventListener('click', () => {
          videoTop.play().then(() => {
            videoBottom.play().catch(() => {});
            iosOverlay.style.display = 'none';
          }).catch(() => {
            iosOverlay.style.display = 'none';
          });
        });
      } else {
        videoTop.play().catch(() => {});
        videoBottom.play().catch(() => {});
      }
    });

    // Логотип = кнопка звука (управляет нижним видео)
    logo.addEventListener('click', () => {
      videoBottom.muted = !videoBottom.muted;
      logo.classList.toggle('sound-on', !videoBottom.muted);
    });

    document.querySelectorAll('[mindar-image-target]').forEach((target) => {
      target.addEventListener('targetFound', () => {
        bottomBar.style.display = 'block';
        bottomPlane.setAttribute('visible', true);
        videoTop.play().catch(() => {});
        videoBottom.play().catch(() => {});
      });

      target.addEventListener('targetLost', () => {
        bottomBar.style.display = 'none';
        bottomPlane.setAttribute('visible', false);
      });
    });
  </script>

</body>
</html>
