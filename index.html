<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
    
    /* Экран загрузки */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: -apple-system, sans-serif;
    }
    #loading h2 { font-size: 20px; margin-bottom: 10px; }
    #loading p { font-size: 14px; color: #aaa; text-align: center; padding: 0 30px; }
    .spinner {
      width: 40px; height: 40px; margin-bottom: 20px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Подсказка */
    #hint {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      padding: 12px 24px; border-radius: 25px;
      font-family: -apple-system, sans-serif; font-size: 14px;
      z-index: 100; text-align: center;
      animation: fadeInUp 0.5s ease;
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateX(-50%) translateY(20px); }
      to { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    /* Название блюда */
    #dish-name {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      padding: 8px 20px; border-radius: 20px;
      font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600;
      z-index: 100; display: none;
    }
  </style>
</head>
<body>

  <!-- Экран загрузки -->
  <div id="loading">
    <div class="spinner"></div>
    <h2>AR Меню загружается...</h2>
    <p>Разрешите доступ к камере</p>
  </div>

  <!-- Подсказка -->
  <div id="hint">📱 Наведите камеру на меню</div>

  <!-- Название блюда (появляется при обнаружении) -->
  <div id="dish-name"></div>

  <!-- AR сцена -->
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 3; filterMinCF: 0.001; filterBeta: 100;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">
    
    <!-- Свет для реалистичности -->
    <a-light type="ambient" intensity="0.8"></a-light>
    <a-light type="directional" intensity="0.6" position="0 2 1"></a-light>

    <!-- 3D модели блюд — добавляй свои GLB файлы сюда -->
    <a-assets>
      <!-- Замени на свои модели -->
      <a-asset-item id="dish-0" src="./14_02_2026.glb"></a-asset-item>
      <!-- <a-asset-item id="dish-1" src="./models/dish-1.glb"></a-asset-item> -->
      <!-- <a-asset-item id="dish-2" src="./models/dish-2.glb"></a-asset-item> -->
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Блюдо 0 — привязано к первой картинке меню (targetIndex: 0) -->
    <a-entity mindar-image-target="targetIndex: 0">
      <a-gltf-model
        src="#dish-0"
        position="0 0 0"
        rotation="0 0 0"
        scale="2 2 2"
        animation="property: position; to: 0 0.05 0; dur: 1000; easing: easeOutQuad; startEvents: model-loaded">
      </a-gltf-model>
    </a-entity>

    <!-- Блюдо 1 — раскомментируй когда добавишь вторую картинку -->
    <!--
    <a-entity mindar-image-target="targetIndex: 1">
      <a-gltf-model
        src="#dish-1"
        position="0 0 0.05"
        rotation="-90 0 0"
        scale="0.3 0.3 0.3">
      </a-gltf-model>
    </a-entity>
    -->

  </a-scene>

  <script>
    // Названия блюд — добавляй свои
    const dishNames = {
      0: "Italian Supreme Pizza — $16.95",
      // 1: "BBQ Chicken Pizza — $15.95",
      // 2: "Margherita — $14.95",
    };

    // Убрать экран загрузки когда AR готов
    const scene = document.querySelector("a-scene");
    scene.addEventListener("arReady", () => {
      document.getElementById("loading").style.display = "none";
    });

    // Показать название блюда при обнаружении маркера
    document.querySelectorAll("[mindar-image-target]").forEach((target) => {
      target.addEventListener("targetFound", (e) => {
        const idx = target.getAttribute("mindar-image-target").targetIndex;
        const nameEl = document.getElementById("dish-name");
        nameEl.textContent = dishNames[idx] || "Блюдо";
        nameEl.style.display = "block";
        document.getElementById("hint").style.display = "none";
      });

      target.addEventListener("targetLost", () => {
        document.getElementById("dish-name").style.display = "none";
        document.getElementById("hint").style.display = "block";
      });
    });
  </script>

</body>
</html>
