<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>AR Меню</title>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <script>
    // Шейдер для удаления чёрного фона из видео
    AFRAME.registerShader('chromakey-black', {
      schema: {
        src: {type: 'map'},
        threshold: {type: 'number', default: 0.15},
        smoothing: {type: 'number', default: 0.1}
      },
      init: function (data) {
        const videoTexture = new THREE.VideoTexture(data.src);
        videoTexture.colorSpace = THREE.SRGBColorSpace;
        this.material = new THREE.ShaderMaterial({
          uniforms: {
            map: {value: videoTexture},
            threshold: {value: data.threshold},
            smoothing: {value: data.smoothing}
          },
          vertexShader: `
            varying vec2 vUv;
            void main() {
              vUv = uv;
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            precision mediump float;
            uniform sampler2D map;
            uniform float threshold;
            uniform float smoothing;
            varying vec2 vUv;
            void main() {
              vec4 color = texture2D(map, vUv);
              float brightness = (color.r + color.g + color.b) / 3.0;
              // Чёрный = низкая яркость
              float isBlack = 1.0 - smoothstep(threshold - smoothing, threshold + smoothing, brightness);
              color.a = 1.0 - isBlack;
              gl_FragColor = color;
            }
          `,
          transparent: true,
          side: THREE.DoubleSide
        });
      },
      update: function (data) {
        if (this.material.uniforms) {
          this.material.uniforms.threshold.value = data.threshold;
          this.material.uniforms.smoothing.value = data.smoothing;
        }
      }
    });

    AFRAME.registerComponent('video-handler', {
      init: function () {
        const video = document.querySelector('#video-src');
        const target = this.el.closest('[mindar-image-target]');
        this.el.setAttribute('visible', false);

        if (target) {
          target.addEventListener('targetFound', () => {
            this.el.setAttribute('visible', true);
            video.play().catch(() => {});
          });

          target.addEventListener('targetLost', () => {
            this.el.setAttribute('visible', false);
            video.pause();
          });
        }
      }
    });
  </script>
  <style>
    body { margin: 0; overflow: hidden; }

    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      color: white; font-family: -apple-system, sans-serif;
    }
    #loading h2 { font-size: 20px; margin-bottom: 10px; }
    #loading p { font-size: 14px; color: #aaa; text-align: center; padding: 0 30px; }
    .spinner {
      width: 40px; height: 40px; margin-bottom: 20px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top: 4px solid #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #hint {
      position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      padding: 12px 24px; border-radius: 25px;
      font-family: -apple-system, sans-serif; font-size: 14px;
      z-index: 100; text-align: center;
    }

    #dish-name {
      position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.7); color: white;
      padding: 8px 20px; border-radius: 20px;
      font-family: -apple-system, sans-serif; font-size: 16px; font-weight: 600;
      z-index: 100; display: none;
    }

    #sound-btn {
      position: fixed; bottom: 30px; right: 20px;
      width: 50px; height: 50px;
      background: rgba(0,0,0,0.7); color: white;
      border: none; border-radius: 50%;
      font-size: 22px; z-index: 100;
      display: none; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <h2>AR Меню загружается...</h2>
    <p>Разрешите доступ к камере</p>
  </div>

  <div id="hint">Наведите камеру на меню</div>
  <div id="dish-name"></div>
  <button id="sound-btn">🔇</button>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; maxTrack: 1; filterMinCF: 0.1; filterBeta: 10;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    loading-screen="enabled: false">

    <a-assets>
      <video id="video-src" src="./done.mp4" muted autoplay playsinline webkit-playsinline loop crossorigin="anonymous" preload="auto"></video>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-plane
        id="video-plane"
        material="shader: flat; src: #video-src;"
        width="1.6"
        height="0.9"
        position="0 0.5 0"
        video-handler>
      </a-plane>
    </a-entity>

  </a-scene>

  <script>
    const video = document.querySelector('#video-src');
    const soundBtn = document.getElementById('sound-btn');
    const scene = document.querySelector('a-scene');
    const hint = document.getElementById('hint');
    const dishName = document.getElementById('dish-name');

    scene.addEventListener('arReady', () => {
      document.getElementById('loading').style.display = 'none';
      // iOS: запускаем видео после первого тапа
      const iosPlay = () => {
        video.play().catch(() => {});
        document.removeEventListener('touchstart', iosPlay);
      };
      document.addEventListener('touchstart', iosPlay);
      video.play().catch(() => {});
    });

    soundBtn.addEventListener('click', () => {
      video.muted = !video.muted;
      soundBtn.textContent = video.muted ? '🔇' : '🔊';
    });

    document.querySelectorAll('[mindar-image-target]').forEach((target) => {
      target.addEventListener('targetFound', () => {
        dishName.textContent = 'AR Видео';
        dishName.style.display = 'block';
        hint.style.display = 'none';
        soundBtn.style.display = 'block';
      });

      target.addEventListener('targetLost', () => {
        dishName.style.display = 'none';
        hint.style.display = 'block';
        soundBtn.style.display = 'none';
      });
    });
  </script>

</body>
</html>
